# ═══════════════════════════════════════════════════════════════════
#  APLICAÇÃO — Backend + Frontend
#  Subir com:  docker compose -f docker-compose.app.yml up -d --build
#
#  ⚠ Pré-requisitos:
#    1. docker compose -f docker-compose.infra.yml up -d
#    2. docker compose -f docker-compose.ia.yml up -d --build
# ═══════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────
  #  BACKEND — Node.js + Fastify + Prisma
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutoria_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    environment:
      - PYTHON_API_URL=http://python-ia:8000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=materiais
      - MINIO_PUBLIC_URL=http://localhost:9000
    command: sh -c "npx prisma generate && npx prisma db push && npx prisma db seed && npm run dev"
    expose:
      - "3001"   # apenas rede interna Docker
    networks:
      - tutoria-network
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./arquivos:/app/arquivos:ro

  # ─────────────────────────────────────────────
  #  FRONTEND — React + Vite
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tutoria_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"   # Frontend React (http://localhost:5173)
    depends_on:
      - backend
    networks:
      - tutoria-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  tutoria-network:
    external: true
