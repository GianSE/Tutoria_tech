# ═══════════════════════════════════════════════════════════════════
#  SERVIÇO DE IA — Python + FastAPI
#  Subir com:  docker compose -f docker-compose.ia.yml up -d --build
# ═══════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────
  #  IA — Python + FastAPI
  # ─────────────────────────────────────────────
  python-ia:
    build:
      context: ./python-ia
      dockerfile: Dockerfile
    container_name: tutoria_python_ia
    restart: unless-stopped
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET_NAME=materiais
      - DB_URL=postgresql://tutoriatech_user:tutoriatech_pass@db:5432/tutoriatech
    expose:
      - "8000"
    networks:
      - tutoria-network
    volumes:
      - ./python-ia:/app

networks:
  tutoria-network:
    external: true
