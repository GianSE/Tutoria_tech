# ═══════════════════════════════════════════════════════════════════
#  APLICAÇÃO — Backend + Frontend + Ngrok
#  Subir com:  docker compose up -d --build
#
#  ⚠ Pré-requisitos:
#    1. docker compose -f docker-compose.infra.yml up -d
#    2. docker compose -f docker-compose.ia.yml up -d --build
# ═══════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────
  #  BACKEND — Node.js + Fastify + Prisma
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutoria_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PYTHON_API_URL=http://python-ia:8000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=materiais
      - MINIO_PUBLIC_URL=http://minio:9000
    command: sh -c "npx prisma generate && npx prisma db push && npx prisma db seed && npx prisma studio --hostname 0.0.0.0 & npm run dev"
    expose:
      - "3001"
      - "5555"
    networks:
      - tutoria-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ─────────────────────────────────────────────
  #  FRONTEND — React + Vite
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tutoria_frontend
    restart: unless-stopped
    expose:
      - "5173"
    depends_on:
      - backend
    networks:
      - tutoria-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ─────────────────────────────────────────────
  #  NGROK — Túnel público para o Frontend
  # ─────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: tutoria_ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http frontend:5173
    ports:
      - "4040:4040"   # Dashboard de inspeção do ngrok (http://localhost:4040)
    depends_on:
      - frontend
    networks:
      - tutoria-network

networks:
  tutoria-network:
    external: true
